[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "industry-classification-graph-explorer"
version = "0.1.0"
description = "Explore fictional industry classification hierarchies and mappings"
requires-python = ">=3.11"
dependencies = ["neo4j>=5.28,<6", "networkx>=3.4,<4", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["industry_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running, dedicated Neo4j database"]
